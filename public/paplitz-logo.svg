<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Sombra sólida negra hacia abajo a la derecha -->
  <rect x="17" y="17" width="71" height="71" fill="#000000" />
  
  <!-- Marco exterior blanco con borde negro -->
  <rect x="11" y="11" width="71" height="71" fill="#FFFFFF" stroke="#000000" stroke-width="4.5" />

  <!-- Matriz de 5x5 puntos cuadrados estilo halftone manga -->
  <g fill="#000000">
    <!-- Fila 1 -->
    <rect x="19.5" y="19.5" width="5" height="5" />
    <rect x="33" y="19.5" width="5" height="5" />
    <rect x="46.5" y="19.5" width="5" height="5" />
    <rect x="60" y="19.5" width="5" height="5" />
    <rect x="73.5" y="19.5" width="5" height="5" />

    <!-- Fila 2 -->
    <rect x="19.5" y="33" width="5" height="5" />
    <rect x="33" y="33" width="5" height="5" />
    <rect x="46.5" y="33" width="5" height="5" />
    <rect x="60" y="33" width="5" height="5" />
    <rect x="73.5" y="33" width="5" height="5" />

    <!-- Fila 3 -->
    <rect x="19.5" y="46.5" width="5" height="5" />
    <rect x="33" y="46.5" width="5" height="5" />
    <rect x="46.5" y="46.5" width="5" height="5" />
    <rect x="60" y="46.5" width="5" height="5" />
    <rect x="73.5" y="46.5" width="5" height="5" />

    <!-- Fila 4 -->
    <rect x="19.5" y="60" width="5" height="5" />
    <rect x="33" y="60" width="5" height="5" />
    <rect x="46.5" y="60" width="5" height="5" />
    <rect x="60" y="60" width="5" height="5" />
    <rect x="73.5" y="60" width="5" height="5" />

    <!-- Fila 5 -->
    <rect x="19.5" y="73.5" width="5" height="5" />
    <rect x="33" y="73.5" width="5" height="5" />
    <rect x="46.5" y="73.5" width="5" height="5" />
    <rect x="60" y="73.5" width="5" height="5" />
    <rect x="73.5" y="73.5" width="5" height="5" />
  </g>

  <!-- Cara del cubo central girada ~12.5° con relleno blanco que oculta puntos interiores y trazo negro nítido -->
  <g transform="translate(47.5, 47.5) rotate(12.5) translate(-47.5, -47.5)">
    <rect x="31" y="31" width="33" height="33" fill="#FFFFFF" stroke="#000000" stroke-width="4" />
  </g>
</svg>
